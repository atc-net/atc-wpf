sentence=Mirrors what an ESP32 shows on a display to the Atc.Wpf display controls over serial, TCP, UDP or MQTT.
paragraph=Whole frames (mono pages, RGB565, e-paper planes) or raw bus traffic (Commands/Data, I2C writes, MAX7219 latches), with a U8g2 byte-procedure tee. The protocol encoder AtcMirrorProtocol.h is portable C++ without Arduino dependencies.
