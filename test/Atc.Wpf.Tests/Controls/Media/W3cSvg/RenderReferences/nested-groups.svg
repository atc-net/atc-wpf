<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Scaled outer group, rotated inner group: a blue diamond centred in the frame -->
  <g transform="translate(50,50) scale(1.5)">
    <g transform="rotate(45)">
      <rect x="-10" y="-10" width="20" height="20" fill="#1e64c8" />
    </g>
  </g>
  <!-- translate then rotate: an arrow drawn pointing right ends up pointing down, top-left -->
  <g transform="translate(20,20) rotate(90)">
    <polygon points="-10,-4 2,-4 2,-9 10,0 2,9 2,4 -10,4" fill="#c82828" />
  </g>
  <!-- mirrored nested group: a triangle drawn pointing right ends up pointing left, top-right -->
  <g transform="translate(80,20)">
    <g transform="scale(-1,1)">
      <polygon points="-8,-8 8,0 -8,8" fill="#28a03c" />
    </g>
  </g>
  <!-- three-function list: the circle moves right, is rotated up, then placed at (80,70) -->
  <circle cx="0" cy="0" r="6" fill="#e68c14" transform="translate(80,80) rotate(-90) translate(10,0)" />
</svg>
